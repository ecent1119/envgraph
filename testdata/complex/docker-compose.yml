version: "3.8"

services:
  frontend:
    image: node:20-alpine
    build:
      context: ./frontend
    environment:
      - NODE_ENV=${NODE_ENV}
      - API_URL=http://api:3000
      - AUTH_SECRET
      - CACHE_TTL=3600
    env_file:
      - .env
      - .env.local
    depends_on:
      - api

  api:
    image: node:20-alpine
    build:
      context: ./api
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${AUTH_SECRET}
      - SHARED_VAR=from-compose
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    image: python:3.11-slim
    build:
      context: ./worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - AUTH_SECRET
    env_file:
      - .env

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # Edge case: service with no env
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:

networks:
  default:
    driver: bridge
